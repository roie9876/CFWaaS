#cloud-config
write_files:
  - path: /opt/faas-receiver.py
    permissions: '0644'
    content: |
      from http.server import BaseHTTPRequestHandler, HTTPServer
      import json
      class Receiver(BaseHTTPRequestHandler):
          def do_GET(self):
              body = json.dumps({"sourceIp": self.client_address[0], "path": self.path}).encode()
              self.send_response(200)
              self.send_header("Content-Type", "application/json")
              self.end_headers()
              self.wfile.write(body)
      HTTPServer(("0.0.0.0", 8080), Receiver).serve_forever()
  - path: /etc/systemd/system/faas-receiver.service
    permissions: '0644'
    content: |
      [Unit]
      After=network-online.target
      Wants=network-online.target
      [Service]
      User=labuser
      ExecStart=/usr/bin/python3 /opt/faas-receiver.py
      Restart=always
      [Install]
      WantedBy=multi-user.target
runcmd:
  - systemctl daemon-reload
  - systemctl enable --now faas-receiver.service
